name: Build Unsigned iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build iOS
    runs-on: macos-13
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Expo Prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build Unsigned App
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list | awk '/Schemes:/{getline; print $1}')
          echo "Building workspace: $WORKSPACE with scheme: $SCHEME"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -derivedDataPath ./DerivedData

      - name: Package into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find ios/DerivedData/Build/Products -name "*.app" -type d | head -n 1)
          echo "Uygulama yolu bulundu: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r LeyTV-Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeyTV-IPA
          path: LeyTV-Unsigned.ipa
